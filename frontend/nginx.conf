server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same-origin API: forward /api to the Spring Boot container ("backend" is
  # its service name on the compose network).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints asset filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing: unknown paths fall back to the SPA entry point.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
